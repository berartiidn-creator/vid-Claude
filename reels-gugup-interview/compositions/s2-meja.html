    const tl = gsap.timeline({ paused: true });

    tl.set("#s2-b1, #s2-b2, #s2-b3", { opacity: 0 }, 0);
    blurIn("#s2-b1", 0.03);
    blurIn("#s2-b2", 0.33);
    blurIn("#s2-b3", 0.83);

    // cold hands: thermometer drops
    tl.fromTo("#s2-thermo", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.35, ease: "expo.out" }, 1.15);
    tl.fromTo("#s2-merc", { scaleY: 0.85, transformOrigin: "50% 100%" },
      { scaleY: 0.12, duration: 0.8, ease: "power2.inOut" }, 1.4);
    blurIn("#s2-cold", 1.85);

    // shaky voice
    blurOut("#s2-thermo, #s2-cold", 2.37);
    tl.fromTo("#s2-wave", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.35, ease: "expo.out" }, 2.5);

      tl.fromTo("#s2-bar" + i, { scaleY: lows[i], transformOrigin: "50% 50%" },
        { scaleY: 1, duration: d, ease: "sine.inOut", yoyo: true, repeat: Math.floor(2.5 / d) | 1 }, 2.55 + i * 0.015);
